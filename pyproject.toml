[project]
name = "projet-railinsight"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "pandas>=3.1.1",
    "plotly>=7.1.0",
    "streamlit>=1.67.0",
]

[project.scripts]
projet-railinsight = "projet_railinsight:main"

[build-system]
requires = ["uv_build>=0.12.17,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.4",
    "sphinx>=9.2.0",
]
