name: Tests Python

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests de saisonnalité — Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MPLBACKEND: Agg

    steps:
      - name: Récupérer le code
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Installer uv et Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Installer les dépendances verrouillées
        run: uv sync --locked --dev

      - name: Lancer les tests et mesurer la couverture
        run: >-
          uv run --no-sync pytest tests/ -v
          --cov=projet_railinsight.saisonnalite
          --cov=projet_railinsight.moteur_sql
          --cov-report=term-missing
