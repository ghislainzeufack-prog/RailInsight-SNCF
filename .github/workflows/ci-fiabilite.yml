
name: CI - Fiabilite TGV

on:
  push:
    branches:
      - feature/fiabilite-indicateurs

  pull_request:
    branches:
      - main
    paths:
      - "src/projet_railinsight/fiabilite.py"
      - "src/projet_railinsight/preprocessing_fiabilite.py"
      - "tests/test_fiabilite.py"
      - "tests/test_preprocessing_fiabilite.py"
      - "pages/05_Fiabilite.py"
      - ".github/workflows/ci-fiabilite.yml"

permissions:
  contents: read

jobs:
  qualite-et-tests:
    runs-on: ubuntu-latest

    steps:
      - name: Recuperation du code
        uses: actions/checkout@v6

      - name: Installation de uv et Python
        uses: astral-sh/setup-uv@v10
        with:
          python-version: "3.14"
          enable-cache: true

      - name: Installation des dependances
        run: uv sync --locked --group dev

      - name: Verification Ruff
        run: |
          uv run ruff check \
            src/projet_railinsight/fiabilite.py \
            src/projet_railinsight/preprocessing_fiabilite.py \
            tests/test_fiabilite.py \
            tests/test_preprocessing_fiabilite.py \
            pages/05_Fiabilite.py

      - name: Verification du formatage
        run: |
          uv run ruff format --check \
            src/projet_railinsight/fiabilite.py \
            src/projet_railinsight/preprocessing_fiabilite.py \
            tests/test_fiabilite.py \
            tests/test_preprocessing_fiabilite.py \
            pages/05_Fiabilite.py

      - name: Tests et couverture
        run: |
          uv run pytest \
            tests/test_fiabilite.py \
            tests/test_preprocessing_fiabilite.py \
            --cov=projet_railinsight.fiabilite \
            --cov=projet_railinsight.preprocessing_fiabilite \
            --cov-report=term-missing \
            --cov-fail-under=80
